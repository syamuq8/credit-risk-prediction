<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - FinGuard AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bg-body) 0%, rgba(37, 99, 235, 0.05) 100%);
        }
        .login-card {
            width: 100%;
            max-width: 420px;
        }
    </style>
</head>
<body class="bg-light">
    <div class="login-wrapper">
        <div class="login-card glass-card p-4 animate-fade-in">
            <div class="text-center mb-4">
                <a href="{{ url_for('dashboard') }}" class="fs-3 fw-bold text-decoration-none text-main d-flex align-items-center justify-content-center gap-2">
                    <i class="bi bi-shield-check-fill text-harlequin"></i> FinGuard AI
                </a>
                <p class="text-muted small mt-1">Admin Portal Authentication</p>
            </div>
            
            {% if error %}
            <div class="alert alert-danger border-0 small py-2 px-3 mb-3 text-center" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
            </div>
            {% endif %}
            
            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label form-label-custom">Admin Username</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0 bg-transparent text-muted"><i class="bi bi-person-fill"></i></span>
                        <input type="text" class="form-control form-control-custom border-start-0" id="username" name="username" placeholder="e.g. admin" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="password" class="form-label form-label-custom">Password</label>
                    <div class="input-group">
                        <span class="input-group-text border-end-0 bg-transparent text-muted"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control form-control-custom border-start-0" id="password" name="password" placeholder="e.g. admin" required>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-custom btn-primary-custom w-100 py-2.5">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Authenticate
                </button>
            </form>
            
            <div class="text-center mt-4">
                <hr class="my-3 border-secondary border-opacity-10">
                <a href="{{ url_for('dashboard') }}" class="text-muted small text-decoration-none"><i class="bi bi-arrow-left"></i> Back to Dashboard</a>
            </div>
        </div>
    </div>
</body>
</html>
